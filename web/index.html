  <script>
    window.addEventListener('flutter-first-frame', () => {
      // Flutter installs a restrictive viewport during engine initialization.
      // Restore browser zoom for low-vision readers after that initialization.
      document.querySelectorAll('meta[name="viewport"]').forEach(meta => {
        meta.content = 'width=device-width, initial-scale=1';
      });
      const splash = document.getElementById('splash');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        splash.remove();
      } else {
        splash.classList.add('loaded');
        window.setTimeout(() => splash.remove(), 200);
      }
    }, { once: true });
  </script>
